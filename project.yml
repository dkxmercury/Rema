name: Rema
options:
  bundleIdPrefix: uz.dkx
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  RemaCore:
    path: Packages/RemaCore
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.6
targets:
  Rema:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - package: RemaCore
      - target: RemaWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.dkx.rema
        PRODUCT_NAME: Rema
        CODE_SIGN_ENTITLEMENTS: App/Rema.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rema
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "The microphone is used only while you dictate a reminder."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech is turned into text to create a reminder."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Location is used to remind you when you arrive at or leave your places."
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - RemaSnapshots
      gatherCoverageData: false
      commandLineArguments:
        "-AppleLanguages (ru)": true
        "-AppleLocale ru_RU": true
  RemaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Shared
      - path: App/Theme
      - path: App/Services/Describer.swift
      - path: App/Components/Glyph.swift
      - path: App/Components/CheckBox.swift
      - path: App/Components/Dial.swift
      - path: App/Screens/Home/HomeContent.swift
      - path: App/Resources/Fonts
        buildPhase: resources
      - path: App/Resources/Localizable.xcstrings
    dependencies:
      - package: RemaCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Rema
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.dkx.rema.widgets
        PRODUCT_NAME: RemaWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Widgets/RemaWidgets.entitlements
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
  RemaSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Snapshots
    dependencies:
      - target: Rema
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: uz.dkx.rema.snapshots
