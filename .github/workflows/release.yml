name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: adhoc for phones, store for App Store
        type: choice
        options: [adhoc, store]
        default: adhoc

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          PROFILE_APP_BASE64: ${{ inputs.channel == 'store' && secrets.STORE_PROFILE_APP_BASE64 || secrets.PROFILE_APP_BASE64 }}
          PROFILE_WIDGETS_BASE64: ${{ inputs.channel == 'store' && secrets.STORE_PROFILE_WIDGETS_BASE64 || secrets.PROFILE_WIDGETS_BASE64 }}
          PROFILE_WATCH_BASE64: ${{ inputs.channel == 'store' && secrets.STORE_PROFILE_WATCH_BASE64 || secrets.PROFILE_WATCH_BASE64 }}
          PROFILE_SHARE_BASE64: ${{ inputs.channel == 'store' && secrets.STORE_PROFILE_SHARE_BASE64 || secrets.PROFILE_SHARE_BASE64 }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          for name in APPLE_TEAM_ID DIST_P12_BASE64 DIST_P12_PASSWORD PROFILE_APP_BASE64 PROFILE_WIDGETS_BASE64 PROFILE_WATCH_BASE64 PROFILE_SHARE_BASE64 GOOGLE_CLIENT_ID ARTIFACT_KEY; do
            if [ -z "$(printenv "$name")" ]; then echo "missing secret $name"; exit 1; fi
          done

      - name: Certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security -A || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution" || { echo "Apple Distribution identity missing"; exit 1; }

      - name: Profiles
        env:
          PROFILE_APP_BASE64: ${{ inputs.channel == 'store' && secrets.STORE_PROFILE_APP_BASE64 || secrets.PROFILE_APP_BASE64 }}
          PROFILE_WIDGETS_BASE64: ${{ inputs.channel == 'store' && secrets.STORE_PROFILE_WIDGETS_BASE64 || secrets.PROFILE_WIDGETS_BASE64 }}
          PROFILE_WATCH_BASE64: ${{ inputs.channel == 'store' && secrets.STORE_PROFILE_WATCH_BASE64 || secrets.PROFILE_WATCH_BASE64 }}
          PROFILE_SHARE_BASE64: ${{ inputs.channel == 'store' && secrets.STORE_PROFILE_SHARE_BASE64 || secrets.PROFILE_SHARE_BASE64 }}
        run: |
          for folder in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$folder"
          done
          for pair in "APP:$PROFILE_APP_BASE64" "WIDGETS:$PROFILE_WIDGETS_BASE64" "WATCH:$PROFILE_WATCH_BASE64" "SHARE:$PROFILE_SHARE_BASE64"; do
            key="${pair%%:*}"
            file="$RUNNER_TEMP/$key.mobileprovision"
            printf '%s' "${pair#*:}" | base64 --decode > "$file"
            security cms -D -i "$file" > "$RUNNER_TEMP/$key.plist"
            uuid=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/$key.plist")
            name=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/$key.plist")
            cp "$file" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            cp "$file" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
            echo "PROFILE_NAME_$key=$name" >> "$GITHUB_ENV"
          done

      - name: XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Project
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          printf 'GOOGLE_CLIENT_ID = %s\n' "$GOOGLE_CLIENT_ID" > Config/Secrets.xcconfig
          xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive -project Rema.xcodeproj -scheme Rema \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Rema.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            REMA_PROFILE_APP="$PROFILE_NAME_APP" \
            REMA_PROFILE_WIDGETS="$PROFILE_NAME_WIDGETS" \
            REMA_PROFILE_WATCH="$PROFILE_NAME_WATCH" \
            REMA_PROFILE_SHARE="$PROFILE_NAME_SHARE" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" > archive.log 2>&1 || true
          grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" archive.log || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Export
        env:
          METHOD: ${{ inputs.channel == 'store' && 'app-store-connect' || 'release-testing' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>uz.dkx.rema</key><string>$PROFILE_NAME_APP</string>
              <key>uz.dkx.rema.widgets</key><string>$PROFILE_NAME_WIDGETS</string>
              <key>uz.dkx.rema.watchkitapp</key><string>$PROFILE_NAME_WATCH</string>
              <key>uz.dkx.rema.share</key><string>$PROFILE_NAME_SHARE</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Rema.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" > export.log 2>&1 || true
          grep -E "error:|EXPORT (SUCCEEDED|FAILED)" export.log || true
          grep -q "EXPORT SUCCEEDED" export.log

      - name: Encrypt
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
          tool=/opt/homebrew/opt/openssl@3/bin/openssl
          [ -x "$tool" ] || tool=openssl
          "$tool" version
          "$tool" enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$ipa" -out "$RUNNER_TEMP/Rema.ipa.enc" -pass env:ARTIFACT_KEY
          rm -f "$ipa"

      - name: IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rema-${{ inputs.channel }}-${{ github.run_number }}
          path: ${{ runner.temp }}/Rema.ipa.enc
          retention-days: 3

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
