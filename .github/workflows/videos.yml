name: Videos

on:
  workflow_dispatch:
    inputs:
      languages:
        description: languages to record
        default: ru en
      scenes:
        description: scenes to record
        default: Phrase Repeat List Calendar Friends

permissions:
  contents: read

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Project
        run: |
          xcodegen generate

      - name: Device
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')];p=next((x for name in ('iPhone 17 Pro','iPhone 16 Pro') for x in c if x['name']==name),c[0]);print(p['udid'],p['name'],file=sys.stderr);print(p['udid'])")
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild -project Rema.xcodeproj -scheme RemaVideos -destination "id=$DEVICE" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build-for-testing > build.log 2>&1 || true
          grep -E "error:|TEST BUILD (SUCCEEDED|FAILED)" build.log || true
          grep -q "TEST BUILD SUCCEEDED" build.log

      - name: Record
        env:
          LANGUAGES: ${{ inputs.languages }}
          SCENES: ${{ inputs.scenes }}
        # Every scene in each language; next to each video a json file with the marks the scene printed, in seconds of the video.
        # A scene that fails must not stop the others, so the shell runs without -e.
        shell: bash {0}
        run: |
          set -uo pipefail

          DEVICE="${DEVICE:?}"
          LANGUAGES="${LANGUAGES:-ru en}"
          SCENES="${SCENES:-Phrase Repeat List Calendar Friends}"
          mkdir -p videos logs

          # Crash reports of the app, from the Mac and from the simulator, before an erase wipes them.
          reports() {
            find "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE/data/Library/Logs" \
              -name "*.ips" -exec cp {} logs/ \; 2>/dev/null || true
          }

          # A clean simulator for every language: what one run left behind never leaks into the next.
          prepare() {
            local language="$1" locale keyboards
            if [ "$language" = "ru" ]; then
              locale="ru_RU"
              keyboards=("ru_RU@sw=Russian;hw=Automatic" "en_US@sw=QWERTY;hw=Automatic")
            else
              locale="en_US"
              keyboards=("en_US@sw=QWERTY;hw=Automatic")
            fi
            xcrun simctl shutdown "$DEVICE" 2>/dev/null || true
            reports
            xcrun simctl erase "$DEVICE"
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b > /dev/null
            run() { xcrun simctl spawn "$DEVICE" defaults write "$@"; }
            run -g AppleLanguages -array "${locale/_/-}"
            run -g AppleLocale -string "$locale"
            run -g AppleKeyboards -array "${keyboards[@]}"
            run -g AppleKeyboardsExpanded -int 1
            # Corrections, the word bar and the swipe typing tour would change what the scene shows.
            for key in KeyboardAutocorrection KeyboardPrediction KeyboardShowPredictionBar KeyboardAutocapitalization KeyboardCheckSpelling KeyboardContinuousPathEnabled; do
              run com.apple.Preferences "$key" -bool false
            done
            run com.apple.Preferences DidShowContinuousPathIntroduction -bool true
            xcrun simctl shutdown "$DEVICE"
            # The same settings straight into the files as well, the keyboard reads some of them only from there.
            local preferences="$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE/data/Library/Preferences"
            for key in KeyboardAutocorrection KeyboardPrediction KeyboardShowPredictionBar KeyboardAutocapitalization KeyboardCheckSpelling KeyboardContinuousPathEnabled; do
              defaults write "$preferences/com.apple.Preferences" "$key" -bool false
            done
            defaults write "$preferences/com.apple.Preferences" DidShowContinuousPathIntroduction -bool true
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b > /dev/null
            xcrun simctl ui "$DEVICE" appearance light
          }

          for language in $LANGUAGES; do
            [[ "$language" =~ ^[a-z]{2}$ ]] || { echo "bad language $language"; exit 1; }
            prepare "$language"
            for scene in $SCENES; do
              [[ "$scene" =~ ^[A-Za-z]+$ ]] || { echo "bad scene $scene"; exit 1; }
              name="$language-$(echo "$scene" | tr '[:upper:]' '[:lower:]')"
              # Every scene starts from a fresh install, nothing of the scene before stays in the app.
              xcrun simctl uninstall "$DEVICE" uz.dkx.rema 2>/dev/null || true
              xcrun simctl status_bar "$DEVICE" override --time "$(date -u +%H:%M)" --dataNetwork wifi --wifiMode active --wifiBars 3 \
                --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
              sync="$PWD/sync/$name"
              rm -rf "$sync"
              mkdir -p "$sync"
              TEST_RUNNER_DEMO_LANGUAGE="$language" TEST_RUNNER_DEMO_SYNC="$sync" xcodebuild test-without-building \
                -project Rema.xcodeproj -scheme RemaVideos -destination "id=$DEVICE" -derivedDataPath build/dd \
                -only-testing:"RemaVideos/Scenes/test$scene" CODE_SIGNING_ALLOWED=NO > "logs/$name.log" 2>&1 &
              tester=$!
              # The recording starts once the scene is ready, so the launch of the app and its hiccups stay out of the video.
              for _ in $(seq 1 900); do
                [ -f "$sync/ready" ] && break
                kill -0 "$tester" 2>/dev/null || break
                sleep 0.2
              done
              [ -f "$sync/ready" ] || echo "$name: the scene never said it was ready"
              xcrun simctl io "$DEVICE" recordVideo --codec=h264 --force "videos/$name.mp4" 2> "logs/record-$name.txt" &
              recorder=$!
              for _ in $(seq 1 100); do
                grep -q "Recording started" "logs/record-$name.txt" && break
                sleep 0.1
              done
              started=$(python3 -c 'import time; print(time.time())')
              touch "$sync/go"
              wait "$tester"
              sleep 1
              kill -INT "$recorder"
              wait "$recorder" 2>/dev/null
              python3 - "$name" "$started" <<'EOF'
          import json, re, sys
          name, started = sys.argv[1], float(sys.argv[2])
          log = open(f"logs/{name}.log", encoding="utf-8", errors="replace").read()
          marks = []
          for kind, value, place in re.findall(r"SCENE-MARK (\w+) ([0-9.]+)((?: -?[0-9.]+){4})?", log):
              marks.append([kind.lower(), round(float(value) - started, 2)] + [float(x) for x in place.split()])
          json.dump({"marks": marks}, open(f"videos/{name}.json", "w"))
          print(name, marks, "passed" if "** TEST EXECUTE SUCCEEDED **" in log else "check the log")
          EOF
              # Errors of the app and the system's word on why it ended, if it ended before the test did.
              xcrun simctl spawn "$DEVICE" log show --last 4m --style compact \
                --predicate '(process == "Rema" AND (messageType == error OR messageType == fault)) OR (eventMessage CONTAINS "uz.dkx.rema" AND (process == "runningboardd" OR process == "SpringBoard"))' \
                > "logs/device-$name.txt" 2>&1 || true
            done
          done
          reports
          ls -la videos logs

      - name: Videos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: videos
          path: |
            build.log
            videos
            logs
          if-no-files-found: ignore
