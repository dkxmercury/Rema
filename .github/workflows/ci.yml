name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core tests
        working-directory: Packages/RemaCore
        run: swift test

      - name: XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Project
        run: |
          xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Rema.xcodeproj -scheme Rema \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" build.log || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Screens
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')];p=next((x for x in c if x['name']=='iPhone 16e'),c[0]);print(p['udid'],p['name'],file=sys.stderr);print(p['udid'])")
          mkdir -p screens
          TEST_RUNNER_SNAPSHOT_DIR="$PWD/screens" xcodebuild -project Rema.xcodeproj -scheme Rema \
            -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO test > test.log 2>&1 || true
          grep -E "error:|Test Case .* (passed|failed|skipped)|TEST (SUCCEEDED|FAILED)" test.log | tail -40 || true
          ls -la screens

      - name: Logs and screens
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-and-screens
          path: |
            build.log
            test.log
            screens
          if-no-files-found: ignore
