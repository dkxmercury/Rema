name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core tests
        working-directory: Packages/RemaCore
        run: swift test

      - name: Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Rema.xcodeproj -scheme Rema \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" build.log || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Screens
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          mkdir -p screens
          TEST_RUNNER_SNAPSHOT_DIR="$PWD/screens" xcodebuild -project Rema.xcodeproj -scheme Rema \
            -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO test > test.log 2>&1 || true
          grep -E "error:|Test Case .* (passed|failed|skipped)|TEST (SUCCEEDED|FAILED)" test.log | tail -40 || true
          ls -la screens

      - name: Logs and screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-screens
          path: |
            build.log
            test.log
            screens
          if-no-files-found: ignore
